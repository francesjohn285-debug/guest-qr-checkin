<title>Guest Registration</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}

.wrap{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-top:20px;
  box-shadow:0 4px 18px #0001;
}

h1{
  margin:0 0 8px;
  font-size:27px;
  text-align:center;
}

h2{
  margin-top:0;
}

.muted{
  color:#667085;
  font-size:14px;
  text-align:center;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccd2d9;
  border-radius:12px;
  font-size:16px;
  margin:8px 0;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:7px 0;
  background:#1769e0;
  color:white;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  background:#667085;
}

.status{
  text-align:center;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.ok{
  background:#e8f7ee;
  color:#146c35;
}

.bad{
  background:#fdecec;
  color:#a61b1b;
}

#qrSection{
  display:none;
  text-align:center;
  margin-top:20px;
}

#qrcode{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:20px 0;
}

.guest-id{
  background:#f1f5f9;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.guest-id strong{
  display:block;
  margin-bottom:8px;
}

.guest-id span{
  font-size:22px;
  font-weight:bold;
}

hr{
  border:0;
  border-top:1px solid #e5e7eb;
  margin:25px 0;
}

.small{
  font-size:13px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>🎟️ Guest Registration</h1>

<p class="muted">
Register for the event and receive your personal QR code.
</p>

<hr>

<h2>Guest Information</h2>

<input
  type="text"
  id="guestName"
  placeholder="Enter guest full name"
  autocomplete="name"
>

<input
  type="tel"
  id="guestPhone"
  placeholder="Enter phone number"
  autocomplete="tel"
>

<button id="registerBtn">
➕ Register & Generate QR
</button>

<div id="registrationStatus"></div>

<div id="qrSection">

<div class="guest-id">

<strong>Your Guest ID</strong>

<span id="generatedGuestId"></span>

</div>

<div id="qrcode"></div>

<h3>✅ Registration Successful</h3>

<p class="muted">
Keep this QR code and present it at the entrance.
</p>

<button
  id="printQrBtn"
  class="secondary"
>
🖨️ Print / Save QR Invitation
</button>

</div>

</div>

</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<!-- QR CODE GENERATOR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIGURATION
   ===================================================== */

const firebaseConfig = {

  apiKey: "AIzaSyAZ77F2ztEHAWcphnKoSdAAwhNSDqaVryI",

  authDomain: "guest-qr-check-in.firebaseapp.com",

  databaseURL:
    "https://guest-qr-check-in-default-rtdb.firebaseio.com",

  projectId: "guest-qr-check-in",

  storageBucket:
    "guest-qr-check-in.firebasestorage.app",

  messagingSenderId:
    "180097189886",

  appId:
    "1:180097189886:web:6fb39df16a9d88cf9de2af"

};


/* =====================================================
   START FIREBASE
   ===================================================== */

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =====================================================
   PAGE ELEMENTS
   ===================================================== */

const guestName =
  document.getElementById("guestName");

const guestPhone =
  document.getElementById("guestPhone");

const registerBtn =
  document.getElementById("registerBtn");

const registrationStatus =
  document.getElementById("registrationStatus");

const qrSection =
  document.getElementById("qrSection");

const generatedGuestId =
  document.getElementById("generatedGuestId");

const qrcode =
  document.getElementById("qrcode");

const printQrBtn =
  document.getElementById("printQrBtn");


/* =====================================================
   GENERATE UNIQUE GUEST ID
   ===================================================== */

function generateGuestId(){

  const time =
    Date.now().toString().slice(-7);

  const random =
    Math.floor(
      100 + Math.random() * 900
    );

  return "GUEST-" + time + random;

}


/* =====================================================
   REGISTER GUEST
   ===================================================== */

registerBtn.addEventListener(
  "click",
  async function(){

    const name =
      guestName.value.trim();

    const phone =
      guestPhone.value.trim();


    /* CHECK NAME */

    if(!name){

      alert(
        "Please enter the guest full name."
      );

      guestName.focus();

      return;

    }


    /* CHECK PHONE */

    if(!phone){

      alert(
        "Please enter the guest phone number."
      );

      guestPhone.focus();

      return;

    }


    registerBtn.disabled = true;

    registerBtn.textContent =
      "Registering...";


    try{

      /* CREATE GUEST ID */

      const guestId =
        generateGuestId();


      /* SAVE GUEST TO FIREBASE */

      await db
        .ref("guests/" + guestId)
        .set({

          guestId: guestId,

          name: name,

          phone: phone,

          registeredAt:
            firebase.database.ServerValue.TIMESTAMP,

          checkedIn: false

        });


      /* SHOW GUEST ID */

      generatedGuestId.textContent =
        guestId;


      /* CLEAR OLD QR */

      qrcode.innerHTML = "";


      /* CREATE QR CODE */

      new QRCode(
        qrcode,
        {
          text: guestId,

          width:220,

          height:220,

          colorDark:"#000000",

          colorLight:"#ffffff",

          correctLevel:
            QRCode.CorrectLevel.H
        }
      );


      /* SHOW QR SECTION */

      qrSection.style.display =
        "block";


      /* SUCCESS MESSAGE */

      registrationStatus.innerHTML = `

        <div class="status ok">

          <strong>
            ✅ Registration Successful
          </strong>

          <p>
            Welcome, ${escapeHtml(name)}
          </p>

          <p class="small">
            Your Guest ID is:
            <strong>${escapeHtml(guestId)}</strong>
          </p>

        </div>

      `;


      /* CLEAR FORM */

      guestName.value = "";

      guestPhone.value = "";


      /* SCROLL TO QR */

      setTimeout(function(){

        qrSection.scrollIntoView({
          behavior:"smooth"
        });

      },200);


    }catch(error){

      console.error(error);


      registrationStatus.innerHTML = `

        <div class="status bad">

          <strong>
            ❌ Registration Failed
          </strong>

          <p>
            ${escapeHtml(error.message)}
          </p>

        </div>

      `;

    }


    registerBtn.disabled = false;

    registerBtn.textContent =
      "➕ Register & Generate QR";

  }
);


/* =====================================================
   PRINT / SAVE QR
   ===================================================== */

printQrBtn.addEventListener(
  "click",
  function(){

    const guestId =
      generatedGuestId.textContent.trim();

    const name =
      document.querySelector(
        ".status.ok p"
      )?.textContent || "Guest";


    if(!guestId){

      alert(
        "No QR code is available yet."
      );

      return;

    }


    const qrCanvas =
      qrcode.querySelector("canvas");

    const qrImage =
      qrcode.querySelector("img");


    let qrSource = "";


    if(qrCanvas){

      qrSource =
        qrCanvas.toDataURL(
          "image/png"
        );

    }else if(qrImage){

      qrSource =
        qrImage.src;

    }


    if(!qrSource){

      alert(
        "QR code is not ready yet."
      );

      return;

    }


    const printWindow =
      window.open(
        "",
        "_blank"
      );


    printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>Guest QR Invitation</title>

<style>

body{
  font-family:Arial,sans-serif;
  text-align:center;
  padding:40px;
}

.card{
  max-width:450px;
  margin:auto;
  border:2px solid #ddd;
  border-radius:18px;
  padding:30px;
}

img{
  width:220px;
  height:220px;
  margin:20px;
}

h1{
  margin-bottom:5px;
}

.guestid{
  font-size:22px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h1>🎟️ Guest Invitation</h1>

<p>Guest Name</p>

<h2>
${escapeHtml(name)}
</h2>

<p>Guest ID</p>

<div class="guestid">
${escapeHtml(guestId)}
</div>

<img
  src="${qrSource}"
  alt="Guest QR Code"
>

<p>
Please present this QR code at the entrance.
</p>

</div>

</body>

</html>

    `);


    printWindow.document.close();

    printWindow.focus();


    setTimeout(
      function(){

        printWindow.print();

      },
      500
    );

  }
);


/* =====================================================
   SECURITY: ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

  return String(value).replace(
    /[&<>"']/g,
    function(char){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[char];

    }
  );

}

</script>

</body>
</html>
